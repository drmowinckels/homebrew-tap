name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The bump script is the only moving part in this repo, and its failure mode
  # is quiet — a wrong checksum surfaces as a mismatch on a user's machine
  # long after the run went green. So it carries a real test suite.
  script:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck scripts/*.sh test/*.sh
      - name: tests
        run: bash test/bump-cask.test.sh

  casks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Homebrew/actions/setup-homebrew@2026.09.28.1
      - name: brew style
        run: brew style Casks

      # `brew info --cask ./Casks/foo.rb` is rejected outright — Homebrew
      # refuses to load a cask that is not in a tap. Copying the checkout into
      # Homebrew's Taps directory makes *this* commit the tap, which is the
      # point: `brew tap drmowinckels/tap` would clone `main` from GitHub and
      # so would check the wrong code on a pull request.
      - name: Install the working copy as a tap
        run: |
          tap="$(brew --repository)/Library/Taps/drmowinckels/homebrew-tap"
          mkdir -p "$(dirname "$tap")"
          cp -R "$GITHUB_WORKSPACE" "$tap"
          brew tap

      # Proves each cask actually loads. `brew style` is RuboCop over the Ruby
      # source and will happily pass a file whose DSL is wrong.
      - name: casks parse
        run: |
          for cask in Casks/*.rb; do
            token=$(basename "$cask" .rb)
            echo "--- ${token}"
            brew info --cask "drmowinckels/tap/${token}"
          done

  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
