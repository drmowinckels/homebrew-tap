name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The bump script is the only moving part in this repo, and its failure mode
  # is quiet — a wrong checksum surfaces as a mismatch on a user's machine
  # long after the run went green. So it carries a real test suite.
  script:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck scripts/*.sh test/*.sh
      - name: tests
        run: bash test/bump-cask.test.sh

  casks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Homebrew/actions/setup-homebrew@2026.09.28.1
      - name: brew style
        run: brew style Casks

      # Proves each cask actually loads. `brew style` is RuboCop over the Ruby
      # source and will happily pass a file whose DSL is wrong.
      #
      # Referenced by tap name, not by path: `brew info --cask ./Casks/foo.rb`
      # is rejected outright ("Homebrew requires casks to be in a tap"). No
      # setup needed to make that work — because this repository is named
      # `homebrew-<something>`, setup-homebrew has already symlinked the
      # checkout into `Library/Taps/drmowinckels/homebrew-tap` and run
      # `brew trust` on it, so the tap under test is this very commit.
      - name: casks parse
        run: |
          status=0
          for cask in Casks/*.rb; do
            token=$(basename "$cask" .rb)
            echo "--- ${token}"
            if ! out=$(brew info --cask "drmowinckels/tap/${token}" 2>&1); then
              echo "$out"
              status=1
              continue
            fi
            echo "$out"

            # `brew info` exits 0 on a deprecated stanza and merely warns, and
            # `brew style` is RuboCop over the source so it cannot see a
            # *runtime* deprecation either. Between them a deprecated
            # `verified:` url parameter sailed through a fully green run and
            # was only caught by hand on a developer's machine. Grep for it.
            if printf '%s' "$out" | grep -qiE "deprecated|Please report this issue"; then
              echo "::error::${token}: brew reported a deprecation or defect — see the output above"
              status=1
            fi
          done
          exit "$status"

      - name: brew audit
        run: |
          for cask in Casks/*.rb; do
            brew audit --cask --strict "drmowinckels/tap/$(basename "$cask" .rb)"
          done

  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
